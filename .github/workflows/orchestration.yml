name: Meta-Repository Orchestration

on:
  push:
    branches: [main]
    paths:
      - 'registry/*.yaml'
      - 'config/*.yaml'
      - 'scripts/**'
  
  schedule:
    - cron: '0 0 * * 0'  # Weekly sync
  
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - sync-submodules
          - validate-dependencies
          - update-versions
          - create-milestone
          - sync-labels

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      
      - name: Validate orchestration config
        run: |
          yq eval '.' config/orchestration.yaml > /dev/null
          echo "✓ Orchestration config valid"
      
      - name: Validate repository registry
        run: |
          yq eval '.' registry/repositories.yaml > /dev/null
          echo "✓ Repository registry valid"
      
      - name: Validate dependency graph
        run: |
          yq eval '.' registry/dependencies.yaml > /dev/null
          echo "✓ Dependency graph valid"
      
      - name: Check for circular dependencies
        run: |
          ./scripts/lib/dependencies.sh check_circular_dependencies || exit 1
          echo "✓ No circular dependencies"

  sync-submodules:
    name: Synchronize Submodules
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'schedule' || github.event.inputs.action == 'sync-submodules'
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      
      - name: Sync submodules
        run: ./scripts/submodules/sync.sh
      
      - name: Push changes
        run: |
          git push origin main

  update-dependency-graph:
    name: Update Dependency Graph
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Analyze dependencies
        run: |
          echo "Analyzing repository dependencies..."
          ./scripts/lib/dependencies.sh analyze > dependency-report.md
      
      - name: Upload dependency report
        uses: actions/upload-artifact@v3
        with:
          name: dependency-report
          path: dependency-report.md
      
      - name: Update dependency graph visualization
        run: |
          # Generate mermaid diagram
          cat > dependency-graph.mmd << 'EOF'
          graph TD
          EOF
          
          # Add nodes and edges from registry
          yq eval '.graph.edges[] | "    " + .from + " --> " + .to' registry/dependencies.yaml >> dependency-graph.mmd
      
      - name: Commit updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dependency-graph.mmd dependency-report.md
          git commit -m "chore: update dependency graph" || echo "No changes"
          git push origin main

  version-check:
    name: Check Version Consistency
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Check version consistency
        run: |
          echo "Checking version consistency across submodules..."
          
          for module in modules/*; do
            if [ -d "$module" ]; then
              repo_name=$(basename "$module")
              
              # Get version from registry
              registry_version=$(yq eval ".repositories[] | select(.name == \"$repo_name\") | .version" registry/repositories.yaml)
              
              # Get version from repository
              cd "$module"
              repo_version=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
              repo_version=${repo_version#v}
              cd - > /dev/null
              
              if [ "$registry_version" != "$repo_version" ]; then
                echo "⚠️  Version mismatch for $repo_name: registry=$registry_version, repo=$repo_version"
              else
                echo "✓ $repo_name: $repo_version"
              fi
            fi
          done